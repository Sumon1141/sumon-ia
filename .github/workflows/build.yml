          package com.suman.assistant

          import android.animation.ValueAnimator
          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.Path
          import android.graphics.RadialGradient
          import android.graphics.RectF
          import android.graphics.Shader
          import android.view.View
          import android.view.animation.LinearInterpolator

          class OrbView(c: Context) : View(c) {
              private val paint = Paint(Paint.ANTI_ALIAS_FLAG)
              private var t = 0f
              var mode = 0   // 0 প্রস্তুত, 1 শুনছি, 2 ভাবছি, 3 বলছি

              private val anim = ValueAnimator.ofFloat(0f, 1f).apply {
                  duration = 2400
                  repeatCount = ValueAnimator.INFINITE
                  interpolator = LinearInterpolator()
                  addUpdateListener { t = it.animatedValue as Float; invalidate() }
              }

              override fun onAttachedToWindow() { super.onAttachedToWindow(); anim.start() }
              override fun onDetachedFromWindow() { anim.cancel(); super.onDetachedFromWindow() }

              override fun onDraw(cv: Canvas) {
                  val cx = width / 2f
                  val cy = height / 2f
                  val base = minOf(width, height) * 0.26f
                  val speed = when (mode) { 1 -> 2f; 2 -> 3f; 3 -> 3f; else -> 1f }
                  val amp = when (mode) { 1 -> 0.10f; 2 -> 0.05f; 3 -> 0.12f; else -> 0.04f }
                  val ph = (t * speed) % 1f
                  val pulse = 1f + amp * Math.sin(ph * 2 * Math.PI).toFloat()
                  val c0 = if (mode == 1) 0xFFFF9A3C.toInt() else 0xFF19C6FF.toInt()
                  val c1 = if (mode == 1) 0xFFFF4D6D.toInt() else 0xFF6A5CFF.toInt()

                  paint.style = Paint.Style.STROKE
                  paint.strokeWidth = 3f
                  for (i in 0..2) {
                      val k = (ph + i / 3f) % 1f
                      paint.color = Color.argb(((1f - k) * 90).toInt(), 255, 255, 255)
                      cv.drawCircle(cx, cy, base * (1f + k * 0.7f), paint)
                  }

                  paint.style = Paint.Style.FILL
                  paint.shader = RadialGradient(cx - base * 0.3f, cy - base * 0.3f, base * 1.4f * pulse, c0, c1, Shader.TileMode.CLAMP)
                  cv.drawCircle(cx, cy, base * pulse, paint)
                  paint.shader = null

                  paint.color = Color.WHITE
                  val ey = cy - base * 0.10f
                  val blink = if (ph > 0.94f) 0.15f else 1f
                  cv.drawOval(RectF(cx - base * 0.40f, ey - base * 0.13f * blink, cx - base * 0.18f, ey + base * 0.13f * blink), paint)
                  cv.drawOval(RectF(cx + base * 0.18f, ey - base * 0.13f * blink, cx + base * 0.40f, ey + base * 0.13f * blink), paint)

                  paint.style = Paint.Style.STROKE
                  paint.strokeWidth = base * 0.06f
                  paint.strokeCap = Paint.Cap.ROUND
                  val open = if (mode == 3) 0.10f + 0.08f * Math.sin(ph * 2 * Math.PI * 3).toFloat() else 0.05f
                  val path = Path()
                  path.moveTo(cx - base * 0.22f, cy + base * 0.30f)
                  path.quadTo(cx, cy + base * (0.30f + open * 3f), cx + base * 0.22f, cy + base * 0.30f)
                  cv.drawPath(path, paint)
              }
          }
