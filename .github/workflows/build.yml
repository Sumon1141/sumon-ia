name: Build Suman APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Create project files
        run: |
          mkdir -p Suman/app Suman/app/src/main Suman/app/src/main/java/com/suman/assistant Suman/app/src/main/res/drawable Suman/app/src/main/res/mipmap-anydpi-v26 Suman/app/src/main/res/values Suman/app/src/main/res/xml
          cat > Suman/app/build.gradle.kts <<'EOF'
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android {
              namespace = "com.suman.assistant"
              compileSdk = 34
              defaultConfig { applicationId = "com.suman.assistant"; minSdk = 26; targetSdk = 34; versionCode = 1; versionName = "1.0" }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF
          cat > Suman/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.CALL_PHONE"/>
              <uses-permission android:name="android.permission.SEND_SMS"/>
              <uses-permission android:name="android.permission.READ_CONTACTS"/>
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES"/>
              <queries>
                  <intent><action android:name="android.speech.RecognitionService"/></intent>
                  <intent><action android:name="android.intent.action.TTS_SERVICE"/></intent>
              </queries>
              <application android:label="@string/app_name" android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher" android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service android:name=".SumanService" android:exported="false"
                      android:label="@string/app_name"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter><action android:name="android.accessibilityservice.AccessibilityService"/></intent-filter>
                      <meta-data android:name="android.accessibilityservice" android:resource="@xml/accessibility_config"/>
                  </service>
              </application>
          </manifest>
          EOF
          cat > Suman/app/src/main/java/com/suman/assistant/MainActivity.kt <<'EOF'
          package com.suman.assistant

          import android.Manifest
          import android.app.Activity
          import android.app.AlertDialog
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.graphics.drawable.GradientDrawable
          import android.hardware.camera2.CameraManager
          import android.media.AudioManager
          import android.net.Uri
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.provider.ContactsContract
          import android.provider.Settings
          import android.speech.RecognitionListener
          import android.speech.RecognizerIntent
          import android.speech.SpeechRecognizer
          import android.speech.tts.TextToSpeech
          import android.speech.tts.UtteranceProgressListener
          import android.telephony.SmsManager
          import android.view.Gravity
          import android.webkit.WebView
          import android.widget.*
          import org.json.JSONArray
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL
          import java.util.Locale
          import java.util.concurrent.CountDownLatch
          import java.util.concurrent.TimeUnit
          import kotlin.concurrent.thread

          class MainActivity : Activity(), TextToSpeech.OnInitListener {
              private val MODEL = "gemini-3.6-flash"  // এরর এলে এখানে আরেকটা Gemini মডেলের নাম দিন

              private val SYSTEM = """তুমি "সুমন", ব্যবহারকারীর ফোনের ভেতরে থাকা বাংলা ভয়েস AI এজেন্ট। তুমি ব্যবহারকারীর হয়ে ফোন চালাও।
          প্রতিবার তোমাকে দেওয়া হবে: অনুরোধ, আগের ধাপ, সর্বশেষ ফলাফল ও বর্তমান স্ক্রিনের তালিকা (প্রতিটি লাইনে [নম্বর] ধরন "লেখা" clickable/editable)।
          তুমি প্রতিবার শুধু একটি JSON অবজেক্ট দেবে, আর কিছু না:
          {"say":"ব্যবহারকারীকে বাংলায় ছোট একটি বাক্য (ভয়েসে পড়া হবে)","action":"...","index":0,"text":"...","to":"..."}
          action-এর মান:
          - answer: কথার উত্তর বা কোড দেওয়া, কাজ এখানেই শেষ। say-তে উত্তর। কোড ``` ব্লকে।
          - done: ফোনের কাজ শেষ হয়েছে। say-তে ছোট সারাংশ।
          - open_app: text = অ্যাপের নাম, ফোনে যেভাবে ইংরেজিতে লেখা (YouTube, WhatsApp, Files, Camera, Settings, Chrome)।
          - open_url: text = ওয়েব ঠিকানা।
          - click: index = স্ক্রিন তালিকার নম্বর।
          - type: index = editable নম্বর (না থাকলে -1), text = যা লিখতে হবে।
          - scroll_down, scroll_up, back, home, recents, notifications, wait।
          - call: to = নাম বা নম্বর। sms: to = নাম বা নম্বর, text = মেসেজ।
          - torch: text = on বা off। volume: text = up বা down।
          - run_js: text = JavaScript কোড (শেষে অবশ্যই return থাকবে)। ফল পরের ধাপে "সর্বশেষ ফলাফল"-এ পাবে, তারপর answer-এ ফল জানাও।
          নিয়ম: একবারে একটাই action। ব্যবহারকারী না চাইলেও প্রশ্ন করো না, সরাসরি কাজ করো। স্ক্রিনে যা নেই তা অনুমান করে ক্লিক করো না, দরকারে scroll করো বা back করো। কাজ হয়ে গেলে অবশ্যই done বা answer দাও। টাকা পাঠানো, কিছু ডিলিট করা বা পাসওয়ার্ড দেওয়ার মতো ঝুঁকির কাজে আগে answer দিয়ে ব্যবহারকারীর অনুমতি চাও। সবসময় বাংলায় বলো, মার্কডাউন তারকা ব্যবহার করো না।"""

              private lateinit var log: LinearLayout
              private lateinit var scroll: ScrollView
              private lateinit var input: EditText
              private lateinit var tts: TextToSpeech
              private lateinit var earBtn: Button
              private var recognizer: SpeechRecognizer? = null
              private var webView: WebView? = null
              private val main = Handler(Looper.getMainLooper())
              private val chat = mutableListOf<String>()
              private val prefs by lazy { getSharedPreferences("suman", MODE_PRIVATE) }
              @Volatile private var handsFree = false
              @Volatile private var busy = false
              @Volatile private var resumed = false
              private var listening = false

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  tts = TextToSpeech(this, this)
                  requestPermissions(arrayOf(Manifest.permission.RECORD_AUDIO, Manifest.permission.CALL_PHONE,
                      Manifest.permission.SEND_SMS, Manifest.permission.READ_CONTACTS), 1)
                  webView = WebView(this).also { it.settings.javaScriptEnabled = true }
                  buildUi()
                  say("আসসালামু আলাইকুম! আমি সুমন। 🎧 চেপে দিলে আমি সবসময় আপনার কথা শুনব। বলুন কী করব?")
              }

              override fun onResume() { super.onResume(); resumed = true
                  main.postDelayed({ if (handsFree && !busy && !tts.isSpeaking) listen() }, 1000) }
              override fun onPause() { super.onPause(); resumed = false }

              override fun onInit(s: Int) {
                  tts.language = Locale("bn", "BD")
                  tts.setOnUtteranceProgressListener(object : UtteranceProgressListener() {
                      override fun onStart(id: String?) {}
                      override fun onError(id: String?) {}
                      override fun onDone(id: String?) {
                          main.post { if (handsFree && !busy && resumed && !tts.isSpeaking) listen() }
                      }
                  })
              }

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()

              private fun buildUi() {
                  val root = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setBackgroundColor(Color.parseColor("#0B1020")); fitsSystemWindows = true }
                  val bar = LinearLayout(this).apply { gravity = Gravity.CENTER_VERTICAL; setPadding(dp(14), dp(10), dp(14), dp(10)) }
                  bar.addView(TextView(this).apply { text = "সুমন"; textSize = 22f; setTextColor(Color.WHITE) }, LinearLayout.LayoutParams(0, -2, 1f))
                  earBtn = Button(this).apply { text = "🎧"; setOnClickListener { toggleHandsFree() } }
                  bar.addView(earBtn)
                  bar.addView(Button(this).apply { text = "🔑"; setOnClickListener { askKey() } })
                  bar.addView(Button(this).apply { text = "♿"; setOnClickListener { startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)) } })
                  root.addView(bar)
                  log = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(dp(12), dp(6), dp(12), dp(6)) }
                  scroll = ScrollView(this).apply { addView(log) }
                  root.addView(scroll, LinearLayout.LayoutParams(-1, 0, 1f))
                  val row = LinearLayout(this).apply { gravity = Gravity.CENTER_VERTICAL; setPadding(dp(10), dp(8), dp(10), dp(8)) }
                  input = EditText(this).apply { hint = "লিখুন…"; setTextColor(Color.WHITE); setHintTextColor(Color.GRAY) }
                  row.addView(input, LinearLayout.LayoutParams(0, -2, 1f))
                  row.addView(Button(this).apply { text = "➤"; setOnClickListener { val q = input.text.toString().trim(); input.setText(""); if (q.isNotEmpty()) handle(q) } })
                  row.addView(Button(this).apply { text = "🎤"; setOnClickListener { listen() } })
                  root.addView(row)
                  setContentView(root)
              }

              private fun toggleHandsFree() {
                  handsFree = !handsFree
                  earBtn.text = if (handsFree) "🎧✓" else "🎧"
                  Toast.makeText(this, if (handsFree) "এখন থেকে সবসময় শুনব" else "শোনা বন্ধ", Toast.LENGTH_SHORT).show()
                  if (handsFree && !busy) listen() else if (!handsFree) { recognizer?.cancel(); listening = false }
              }

              private fun addMsg(text: String, me: Boolean) {
                  val tv = TextView(this).apply {
                      this.text = text; textSize = 16f; setTextColor(Color.WHITE); setTextIsSelectable(true)
                      setPadding(dp(12), dp(8), dp(12), dp(8))
                      background = GradientDrawable().apply { cornerRadius = dp(14).toFloat(); setColor(Color.parseColor(if (me) "#2B3A8F" else "#151B33")) }
                  }
                  val lp = LinearLayout.LayoutParams(-2, -2).apply { setMargins(0, dp(4), 0, dp(4)); gravity = if (me) Gravity.END else Gravity.START }
                  log.addView(tv, lp)
                  scroll.post { scroll.fullScroll(ScrollView.FOCUS_DOWN) }
              }

              private fun say(text: String) {
                  runOnUiThread { addMsg(text, false) }
                  val clean = text.replace(Regex("```[\\s\\S]*?```"), " কোডটি স্ক্রিনে দেখুন। ").replace(Regex("[*#`]"), "")
                  tts.speak(clean, TextToSpeech.QUEUE_ADD, null, "u" + System.nanoTime())
              }

              private fun listen() {
                  if (listening) return
                  listening = true
                  recognizer?.destroy()
                  recognizer = SpeechRecognizer.createSpeechRecognizer(this).also { r ->
                      r.setRecognitionListener(object : RecognitionListener {
                          override fun onResults(res: Bundle?) {
                              listening = false
                              res?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)?.firstOrNull()?.let { handle(it) }
                          }
                          override fun onError(e: Int) {
                              listening = false
                              if (handsFree && !busy && resumed) main.postDelayed({ if (!tts.isSpeaking) listen() }, 1500)
                          }
                          override fun onReadyForSpeech(p: Bundle?) {}
                          override fun onBeginningOfSpeech() {}
                          override fun onRmsChanged(v: Float) {}
                          override fun onBufferReceived(b: ByteArray?) {}
                          override fun onEndOfSpeech() {}
                          override fun onPartialResults(p: Bundle?) {}
                          override fun onEvent(t: Int, p: Bundle?) {}
                      })
                      r.startListening(Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH)
                          .putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                          .putExtra(RecognizerIntent.EXTRA_LANGUAGE, "bn-BD"))
                  }
              }

              private fun handle(q: String) {
                  if (busy) return
                  addMsg(q, true); tts.stop(); busy = true
                  thread {
                      try { runAgent(q) } catch (e: Exception) { say("দুঃখিত, সমস্যা হয়েছে: " + (e.message ?: "")) }
                      finally {
                          busy = false
                          if (!resumed) bringToFront()
                          main.post { if (handsFree && resumed && !tts.isSpeaking) listen() }
                      }
                  }
              }

              private fun bringToFront() {
                  val c: Context = SumanService.inst ?: this
                  try { c.startActivity(Intent(this, MainActivity::class.java).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_REORDER_TO_FRONT)) } catch (e: Exception) {}
              }

              private fun bn2en(s: String) = s.map { c -> if (c in '০'..'৯') ('0' + (c - '০')) else c }.joinToString("")

              private fun runAgent(goal: String) {
                  val key = prefs.getString("key", "") ?: ""
                  if (key.isEmpty()) { say("আগে 🔑 বাটনে Gemini API Key দিন।"); return }
                  val steps = mutableListOf<String>()
                  var obs = ""
                  chat.add("ব্যবহারকারী: $goal")
                  for (i in 1..15) {
                      val screen = SumanService.inst?.dumpScreen() ?: "(সুমনের অ্যাক্সেসিবিলিটি চালু নেই, তাই স্ক্রিন দেখা যাচ্ছে না)"
                      val prompt = "অনুরোধ: $goal\n\nআগের কথোপকথন:\n" + chat.takeLast(8).joinToString("\n") +
                          "\n\nএই অনুরোধে এ পর্যন্ত ধাপ:\n" + steps.takeLast(6).joinToString("\n") +
                          "\n\nসর্বশেষ ফলাফল: $obs\n\nবর্তমান স্ক্রিন:\n$screen"
                      val raw = gemini(key, prompt)
                      val s0 = raw.indexOf('{'); val e0 = raw.lastIndexOf('}')
                      if (s0 < 0 || e0 < s0) { say(raw); chat.add("সুমন: $raw"); return }
                      val j = JSONObject(raw.substring(s0, e0 + 1))
                      val say = j.optString("say"); val act = j.optString("action")
                      val idx = j.optInt("index", -1); val text = j.optString("text"); val to = j.optString("to")
                      if (say.isNotBlank()) say(say)
                      steps.add("$i. $act index=$idx text=$text to=$to")
                      if (act == "answer" || act == "done") { chat.add("সুমন: $say"); return }
                      obs = doAction(act, idx, text, to)
                      Thread.sleep(if (act == "open_app" || act == "open_url") 2500 else 1300)
                  }
                  say("১৫ ধাপে শেষ করতে পারিনি। আবার বলুন বা আরেকটু সহজ করে বলুন।")
              }

              private fun doAction(act: String, idx: Int, text: String, to: String): String {
                  val svc = SumanService.inst
                  val c: Context = svc ?: this
                  fun needSvc(f: (SumanService) -> Boolean): String =
                      if (svc == null) "অ্যাক্সেসিবিলিটি চালু নেই" else if (f(svc)) "ঠিক আছে" else "কাজ হয়নি"
                  return try {
                      when (act) {
                          "open_app" -> if (openApp(text)) "অ্যাপ খুলেছে" else "এই নামে অ্যাপ পাওয়া যায়নি"
                          "open_url" -> { c.startActivity(Intent(Intent.ACTION_VIEW, Uri.parse(text)).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)); "খুলেছে" }
                          "click" -> needSvc { it.clickIndex(idx) }
                          "type" -> needSvc { it.typeText(idx, text) }
                          "scroll_down" -> needSvc { it.scroll(true) }
                          "scroll_up" -> needSvc { it.scroll(false) }
                          "back" -> needSvc { it.back() }
                          "home" -> needSvc { it.home() }
                          "recents" -> needSvc { it.recents() }
                          "notifications" -> needSvc { it.notifications() }
                          "wait" -> "অপেক্ষা করা হলো"
                          "call" -> {
                              val n = resolveNumber(to) ?: return "\"$to\" নম্বর পাওয়া যায়নি"
                              val granted = checkSelfPermission(Manifest.permission.CALL_PHONE) == PackageManager.PERMISSION_GRANTED
                              c.startActivity(Intent(if (granted) Intent.ACTION_CALL else Intent.ACTION_DIAL, Uri.parse("tel:$n")).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
                              "কল শুরু হয়েছে"
                          }
                          "sms" -> {
                              val n = resolveNumber(to) ?: return "\"$to\" নম্বর পাওয়া যায়নি"
                              if (checkSelfPermission(Manifest.permission.SEND_SMS) != PackageManager.PERMISSION_GRANTED) return "SMS পাঠানোর অনুমতি নেই"
                              val sm = SmsManager.getDefault()
                              sm.sendMultipartTextMessage(n, null, sm.divideMessage(text), null, null)
                              "SMS পাঠানো হয়েছে"
                          }
                          "torch" -> {
                              val cm = getSystemService(Context.CAMERA_SERVICE) as CameraManager
                              cm.setTorchMode(cm.cameraIdList[0], text.lowercase() == "on"); "টর্চ ঠিক আছে"
                          }
                          "volume" -> {
                              val am = getSystemService(Context.AUDIO_SERVICE) as AudioManager
                              repeat(3) { am.adjustStreamVolume(AudioManager.STREAM_MUSIC, if (text == "up") AudioManager.ADJUST_RAISE else AudioManager.ADJUST_LOWER, AudioManager.FLAG_SHOW_UI) }
                              "ভলিউম ঠিক আছে"
                          }
                          "run_js" -> runJs(text)
                          else -> "অজানা action: $act"
                      }
                  } catch (e: Exception) { "ত্রুটি: " + (e.message ?: e.javaClass.simpleName) }
              }

              private fun runJs(code: String): String {
                  val latch = CountDownLatch(1)
                  var res = "ফল পাওয়া যায়নি"
                  val wrapped = "(function(){try{var r=(new Function(" + JSONObject.quote(code) + "))();return String(r)}catch(e){return 'error: '+e}})()"
                  runOnUiThread {
                      val w = webView
                      if (w == null) latch.countDown() else w.evaluateJavascript(wrapped) { v -> res = v ?: "null"; latch.countDown() }
                  }
                  latch.await(10, TimeUnit.SECONDS)
                  return "JS ফল: $res"
              }

              private fun resolveNumber(toRaw: String): String? {
                  val to = bn2en(toRaw).trim()
                  val d = to.filter { it.isDigit() || it == '+' }
                  if (d.length >= 6) return d
                  if (checkSelfPermission(Manifest.permission.READ_CONTACTS) != PackageManager.PERMISSION_GRANTED) return null
                  val P = ContactsContract.CommonDataKinds.Phone
                  contentResolver.query(P.CONTENT_URI, arrayOf(P.NUMBER), P.DISPLAY_NAME + " LIKE ?", arrayOf("%$to%"), null)?.use {
                      if (it.moveToFirst()) return it.getString(0)
                  }
                  return null
              }

              private fun openApp(name: String): Boolean {
                  val key = name.lowercase().trim()
                  if (key.isEmpty()) return false
                  val pm = packageManager
                  val apps = pm.queryIntentActivities(Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER), 0)
                  val hit = apps.firstOrNull { it.loadLabel(pm).toString().lowercase().contains(key) } ?: return false
                  val li = pm.getLaunchIntentForPackage(hit.activityInfo.packageName) ?: return false
                  li.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                  val c: Context = SumanService.inst ?: this
                  c.startActivity(li)
                  return true
              }

              private fun askKey() {
                  val et = EditText(this).apply { hint = "AIza..."; setText(prefs.getString("key", "")) }
                  AlertDialog.Builder(this).setTitle("Gemini API Key").setView(et)
                      .setPositiveButton("সেভ") { _, _ -> prefs.edit().putString("key", et.text.toString().trim()).apply() }
                      .setNegativeButton("বাতিল", null).show()
              }

              private fun gemini(key: String, prompt: String): String {
                  val body = JSONObject()
                      .put("systemInstruction", JSONObject().put("parts", JSONArray().put(JSONObject().put("text", SYSTEM))))
                      .put("contents", JSONArray().put(JSONObject().put("role", "user").put("parts", JSONArray().put(JSONObject().put("text", prompt)))))
                      .put("generationConfig", JSONObject().put("responseMimeType", "application/json"))
                  val c = URL("https://generativelanguage.googleapis.com/v1beta/models/" + MODEL + ":generateContent").openConnection() as HttpURLConnection
                  c.requestMethod = "POST"; c.doOutput = true; c.connectTimeout = 20000; c.readTimeout = 60000
                  c.setRequestProperty("x-goog-api-key", key)
                  c.setRequestProperty("content-type", "application/json")
                  c.outputStream.use { it.write(body.toString().toByteArray()) }
                  val ok = c.responseCode in 200..299
                  val txt = (if (ok) c.inputStream else c.errorStream).bufferedReader().readText()
                  if (!ok) throw RuntimeException("Gemini HTTP " + c.responseCode + " (Key বা মডেলের নাম দেখুন)")
                  val parts = JSONObject(txt).getJSONArray("candidates").getJSONObject(0).getJSONObject("content").getJSONArray("parts")
                  val sb = StringBuilder()
                  for (i in 0 until parts.length()) sb.append(parts.getJSONObject(i).optString("text"))
                  return sb.toString()
              }
          }
