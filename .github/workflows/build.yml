          cat > Suman/app/src/main/java/com/suman/assistant/SumanService.kt <<'EOF'
          package com.suman.assistant

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.content.Intent
          import android.graphics.Path
          import android.graphics.Rect
          import android.os.Bundle
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo

          class SumanService : AccessibilityService() {
              companion object { var inst: SumanService? = null }

              private val nodes = ArrayList<AccessibilityNodeInfo>()

              override fun onServiceConnected() { inst = this }
              override fun onUnbind(intent: Intent?): Boolean { inst = null; return super.onUnbind(intent) }
              override fun onAccessibilityEvent(e: AccessibilityEvent?) {}
              override fun onInterrupt() {}

              fun back() = performGlobalAction(GLOBAL_ACTION_BACK)
              fun home() = performGlobalAction(GLOBAL_ACTION_HOME)
              fun recents() = performGlobalAction(GLOBAL_ACTION_RECENTS)
              fun notifications() = performGlobalAction(GLOBAL_ACTION_NOTIFICATIONS)

              fun dumpScreen(): String {
                  nodes.clear()
                  val root = rootInActiveWindow ?: return "(স্ক্রিন পড়া যাচ্ছে না)"
                  val sb = StringBuilder("অ্যাপ: ").append(root.packageName).append('\n')
                  walk(root, sb)
                  return sb.toString().take(7000)
              }

              private fun walk(n: AccessibilityNodeInfo?, sb: StringBuilder) {
                  if (n == null || nodes.size >= 120) return
                  val t = (n.text ?: n.contentDescription ?: "").toString().replace("\n", " ").take(60)
                  if (n.isVisibleToUser && (t.isNotEmpty() || n.isClickable || n.isEditable)) {
                      sb.append('[').append(nodes.size).append("] ")
                          .append(n.className?.toString()?.substringAfterLast('.') ?: "")
                          .append(" \"").append(t).append('"')
                      if (n.isClickable) sb.append(" clickable")
                      if (n.isEditable) sb.append(" editable")
                      if (n.isScrollable) sb.append(" scrollable")
                      sb.append('\n')
                      nodes.add(n)
                  }
                  for (i in 0 until n.childCount) walk(n.getChild(i), sb)
              }

              fun clickIndex(i: Int): Boolean {
                  val n = nodes.getOrNull(i) ?: return false
                  var x: AccessibilityNodeInfo? = n
                  while (x != null && !x.isClickable) x = x.parent
                  if (x != null && x.performAction(AccessibilityNodeInfo.ACTION_CLICK)) return true
                  val r = Rect(); n.getBoundsInScreen(r)
                  return tapAt(r.centerX().toFloat(), r.centerY().toFloat())
              }

              fun tapAt(x: Float, y: Float): Boolean {
                  val p = Path().apply { moveTo(x, y) }
                  val g = GestureDescription.Builder().addStroke(GestureDescription.StrokeDescription(p, 0, 80)).build()
                  return dispatchGesture(g, null, null)
              }

              fun typeText(i: Int, text: String): Boolean {
                  val n = nodes.getOrNull(i)?.takeIf { it.isEditable }
                      ?: rootInActiveWindow?.findFocus(AccessibilityNodeInfo.FOCUS_INPUT)
                      ?: return false
                  val args = Bundle().apply { putCharSequence(AccessibilityNodeInfo.ACTION_ARGUMENT_SET_TEXT_CHARSEQUENCE, text) }
                  return n.performAction(AccessibilityNodeInfo.ACTION_SET_TEXT, args)
              }

              fun scroll(forward: Boolean): Boolean {
                  val node = findScrollable(rootInActiveWindow) ?: return false
                  return node.performAction(
                      if (forward) AccessibilityNodeInfo.ACTION_SCROLL_FORWARD else AccessibilityNodeInfo.ACTION_SCROLL_BACKWARD)
              }

              private fun findScrollable(n: AccessibilityNodeInfo?): AccessibilityNodeInfo? {
                  if (n == null) return null
                  if (n.isScrollable) return n
                  for (i in 0 until n.childCount) findScrollable(n.getChild(i))?.let { return it }
                  return null
              }
          }
